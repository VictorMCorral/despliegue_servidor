services:
  db:
    image: postgres:16-alpine
    container_name: prietoeats-db
    environment:
      - POSTGRES_DB=prieto_eats
      - POSTGRES_USER=victor
      - POSTGRES_PASSWORD=noteolvides01
    volumes:
      - prietoeats_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U victor -d prieto_eats"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_internal
    restart: unless-stopped

  app:
    image: webdevops/php-nginx:8.2-alpine
    container_name: prietoeats-app
    working_dir: /app
    environment:
      - WEB_DOCUMENT_ROOT=/app/public
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://prietoeats.victor.www.servidorgp.somosdelprieto.com:8081
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=prieto_eats
      - DB_USERNAME=victor
      - DB_PASSWORD=noteolvides01
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
      - VIRTUAL_HOST=prietoeats.victor.www.servidorgp.somosdelprieto.com,localhost
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=prietoeats.victor.www.servidorgp.somosdelprieto.com
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - app_internal
    restart: unless-stopped

networks:
  frontend:
    external: true
  app_internal:
    name: prietoeats_internal

volumes:
  prietoeats_pgdata:
