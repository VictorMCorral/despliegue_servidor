name: Build and Push Proxy Image

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          # IMPORTANTE: Si tu archivo en VS Code es "dockerfile", aquí debe ser minúscula
          file: ./dockerfile  
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/mi-proxy:latest
          
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/mi-proxy:latest'
          format: 'table'
          exit-code: '0' # Cambia a '1' si quieres que el Action falle si hay fallos graves
          severity: 'CRITICAL,HIGH'
          