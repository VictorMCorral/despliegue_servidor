name: Build and Push Proxy Image

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile  
          push: true
          # AQUÍ CONFIGURAMOS LAS ETIQUETAS MÚLTIPLES
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mi-proxy:latest
            ${{ secrets.DOCKER_USERNAME }}/mi-proxy:v${{ github.run_number }}
          
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          # Escaneamos la versión específica que acabamos de crear
          image-ref: '${{ secrets.DOCKER_USERNAME }}/mi-proxy:v${{ github.run_number }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'