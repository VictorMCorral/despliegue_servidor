name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          # Aquí usará los secretos que guardaste en GitHub
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # He puesto el nombre de tu repositorio de GitHub
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/despliegue_servidor:latest
            ${{ secrets.DOCKER_USERNAME }}/despliegue_servidor:${{ github.sha }}
